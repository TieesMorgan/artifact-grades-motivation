<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Oral Disputation to Sorting Machine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #F5F2EB;
      color: #1E1D1A;
      line-height: 1.55;
      padding-bottom: 4rem;
    }

    /* Simple Top Header & Jump Links */
    header {
      background: #1E1D1A;
      color: #F5F2EB;
      text-align: center;
      padding: 2.5rem 1rem 2rem;
    }
    header h1 {
      font-family: Georgia, serif;
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      margin-bottom: 0.5rem;
    }
    header p {
      color: #C7C1B5;
      max-width: 620px;
      margin: 0 auto 1.25rem;
      font-size: 0.98rem;
    }
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .nav-bar a {
      color: #F5F2EB;
      text-decoration: none;
      background: #33312C;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .nav-bar a:hover { background: #D99B38; color: #1E1D1A; }

    /* Visual Cards Container */
    main {
      max-width: 880px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: grid;
      gap: 2.25rem;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #DCD6C8;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .visual-box {
      background: #22201C;
      width: 100%;
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .visual-box svg {
      width: 100%;
      max-height: 330px;
      display: block;
    }
    .card-body {
      padding: 1.5rem;
    }
    .step-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8A6218;
      display: block;
      margin-bottom: 0.25rem;
    }
    .card-body h2 {
      font-family: Georgia, serif;
      font-size: 1.45rem;
      margin-bottom: 0.5rem;
    }
    .card-body p {
      color: #46433C;
      font-size: 0.96rem;
      margin-bottom: 1rem;
    }

    /* Interactive Buttons & Controls */
    .btn-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.85rem;
    }
    button {
      background: #EFECE4;
      border: 1px solid #C8C1B2;
      color: #1E1D1A;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #E2DDD1; }
    button.active {
      background: #1E1D1A;
      color: #FFFFFF;
      border-color: #1E1D1A;
    }
    .callout {
      background: #F8F6F0;
      border-left: 4px solid #2A6F68;
      padding: 0.85rem 1rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      color: #2B2925;
    }

    /* Scene 4: Simple Simulator Controls */
    .sim-panel {
      background: #F8F6F0;
      padding: 1.1rem;
      border-radius: 12px;
      border: 1px solid #E2DDD1;
    }
    .slider-row {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
    }
    input[type="range"] {
      width: 100%;
      margin-bottom: 0.9rem;
      accent-color: #B83A2D;
    }
