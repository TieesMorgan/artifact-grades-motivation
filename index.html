<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Oral Disputation to Sorting Machine | Interactive Infographic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #11100E;
      color: #F7F4EC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.25rem 0.85rem 3rem;
    }

    .poster {
      max-width: 1040px;
      margin: 0 auto;
      background: #1B1A17;
      border: 2px solid #36332C;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }

    /* Header */
    .poster-header {
      background: linear-gradient(135deg, #26231D 0%, #161512 100%);
      border-bottom: 2px solid #36332C;
      padding: 1.5rem 1.25rem;
      text-align: center;
    }

    .poster-sub {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #D99B38;
      font-weight: 800;
      margin-bottom: 0.3rem;
    }

    .poster-header h1 {
      font-family: Georgia, serif;
      font-size: clamp(1.5rem, 3.8vw, 2.4rem);
      letter-spacing: -0.01em;
    }

    /* Infographic Bands */
    .band {
      border-bottom: 2px dashed #322F28;
      padding: 1.25rem;
    }

    .band-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 0.85rem;
    }

    .band-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: #282620;
      border: 1px solid #423E35;
      color: #D99B38;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.32rem 0.85rem;
      border-radius: 999px;
    }

    .hint-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: #A69F91;
      background: #23211C;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      border: 1px solid #36332C;
    }

    .band svg.graphic {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      background: #151412;
      border: 1px solid #2C2A24;
    }

    .clickable {
      cursor: pointer;
      pointer-events: all;
      transition: transform 0.18s ease, opacity 0.2s ease;
    }

    .clickable:hover {
      opacity: 0.92;
    }

    /* Interactive Pill Buttons */
    .pill-controls {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .action-btn {
      background: #25231E;
      border: 1px solid #444036;
      color: #EFECE4;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.38rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover { background: #34312A; }
    .action-btn.active-gold { background: #D99B38; color: #141311; border-color: #D99B38; }
    .action-btn.active-teal { background: #2E8B80; color: #FFF; border-color: #2E8B80; }
    .action-btn.active-red { background: #D94E3F; color: #FFF; border-color: #D94E3F; }

    /* BAND 1: Reliable HTML/CSS Visual Equation + Clickable X-Ray Card */
    .b1-stage {
      background: #151412;
      border: 1px solid #2C2A24;
      border-radius: 14px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .b1-tile {
      width: 126px;
      height: 156px;
      background: #22201B;
      border: 2px solid #D99B38;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.75rem;
      text-align: center;
    }

    .b1-tile span {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .b1-op {
      font-size: 1.8rem;
      font-weight: 800;
      color: #7D7668;
    }

    .xray-card {
      width: 280px;
      min-height: 186px;
      border-radius: 18px;
      padding: 1rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, border-color 0.25s ease, background 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .xray-card:hover {
      transform: scale(1.02);
    }

    .xray-card.closed {
      background: #2E1B19;
      border: 3px solid #D94E3F;
    }

    .xray-card.open {
      background: #1A1F1E;
      border: 3px solid #2E8B80;
    }

    .grade-circle {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: rgba(217, 78, 63, 0.22);
      border: 4px solid #D94E3F;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-size: 2.75rem;
      font-weight: 700;
      color: #D94E3F;
      margin-bottom: 0.65rem;
    }

    .xray-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }

    .xray-cell {
      border-radius: 10px;
      padding: 0.55rem 0.4rem;
      text-align: center;
    }
